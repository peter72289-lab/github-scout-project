<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in — Scout</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--line:#262b33;--amber:#f5b642;--ink:#e8e6e1;--dim:#9aa3ad}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,'Times New Roman',serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:40px;max-width:420px;width:100%}
h1{font-size:26px;margin-bottom:6px}
p{color:var(--dim);font-size:15px;margin-bottom:20px}
label{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-family:system-ui,sans-serif}
input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#0f1216;color:var(--ink);font-size:16px;margin-bottom:16px}
button{width:100%;padding:13px;border-radius:8px;border:0;background:var(--amber);color:#151004;font-weight:700;font-size:16px;cursor:pointer;font-family:system-ui,sans-serif}
button:disabled{opacity:.5;cursor:wait}
.msg{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:14px;font-family:system-ui,sans-serif;display:none}
.msg.ok{display:block;background:#12200f;border:1px solid #2d5426;color:#a7e29a}
.msg.err{display:block;background:#26100f;border:1px solid #5b2622;color:#f0a49b}
a{color:var(--amber)}
.foot{margin-top:22px;font-size:13px;color:var(--dim);font-family:system-ui,sans-serif}
</style>
</head>
<body>
<main class="card">
  <h1>Sign in to Scout</h1>
  <p>No password. We email you a one-time sign-in link that expires in 15 minutes.</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@store.com">
    <button id="btn" type="submit">Email me a sign-in link</button>
  </form>
  <div id="msg" class="msg" role="status"></div>
  <p class="foot">Purchased but never signed in? Use the same email you paid with — your subscription is already attached to it. <a href="/support.html">Need help?</a></p>
</main>
<script>
const f=document.getElementById('f'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
const qsErr=new URLSearchParams(location.search).get('error');
if(qsErr){msg.className='msg err';msg.textContent=qsErr;}
f.addEventListener('submit',async(e)=>{
  e.preventDefault();btn.disabled=true;msg.className='msg';
  try{
    const r=await fetch('/.netlify/functions/auth-request-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});
    const d=await r.json();
    msg.className=r.ok?'msg ok':'msg err';
    msg.textContent=d.message||d.error||'Something went wrong.';
  }catch(err){msg.className='msg err';msg.textContent='Network error — try again.';}
  btn.disabled=false;
});
</script>
</body>
</html>
