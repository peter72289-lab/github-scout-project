[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Daily housekeeping of expired links/sessions/rate rows.
[functions."cleanup-scheduled"]
  schedule = "@daily"

# --- Deny internal files -----------------------------------------------------
# `publish = "."` means the whole v10 folder is the document root, so runbooks,
# the Supabase schema, the test suite, the preflight gate, and the function
# sources all sit at guessable URLs. These rules take them off the public web.
#
# Why explicit paths instead of `/*.md`: Netlify's redirect matcher only
# supports a splat that consumes the REST of the path (`/docs/*`), not an
# extension glob, so a rule like `/*.md` would silently match nothing and read
# as protection that is not there. Directories get a splat; root-level files are
# listed one by one. `force = true` is required — without it a redirect is
# shadowed by a real file at the same path, which is exactly the case here.
#
# `scripts/preflight.js` walks the publish root and fails if any file is neither
# a public asset type nor covered below, so adding an internal file without a
# rule breaks the build instead of leaking. Keep the two lists in sync.
#
# These do not touch `/.netlify/functions/*` (leading dot, different path), the
# 301s below, or any header rule.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/COMMIT-PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY-STAGING.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LAUNCH-CHECKLIST.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LAUNCH-READINESS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# --- Retired and pretty routes ----------------------------------------------
[[redirects]]
  from = "/checkout-command.html"
  to = "/agency-pricing.html"
  status = 301
  force = true

[[redirects]]
  from = "/checkout-command"
  to = "/agency-pricing.html"
  status = 301
  force = true

[[redirects]]
  from = "/operator-shopify-savings"
  to = "/operator-shopify-savings.html"
  status = 200

[[redirects]]
  from = "/operator-url-analysis"
  to = "/operator-url-analysis.html"
  status = 200

[[redirects]]
  from = "/checkout-operator"
  to = "/checkout-operator.html"
  status = 200

[[redirects]]
  from = "/checkout-director"
  to = "/checkout-director.html"
  status = 200

[[redirects]]
  from = "/agency-pricing"
  to = "/agency-pricing.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com https://buy.stripe.com; base-uri 'self'; object-src 'none'"

# Keep authenticated + account surfaces out of search indexes.
[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
